---
layout: barron
title: Blog
permalink: /blog/
nav: true
nav_order: 3
---

<!-- Blog Section -->
<table class="section-table section-table--spaced">
  <tbody>
    <tr>
      <td class="section-cell">
        <h2>Blog</h2>
        <ul class="blog-list">
          {% for post in site.posts %}
          <li>
            <a class="blog-item-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <div class="blog-item-meta">{{ post.date | date: '%B %-d, %Y' }} &nbsp;&middot;&nbsp; {{ post.content | strip_html | number_of_words | divided_by: 180 | plus: 1 }} min read</div>
          </li>
          {% endfor %}
        </ul>
      </td>
    </tr>
  </tbody>
</table>
