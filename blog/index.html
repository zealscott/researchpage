---
layout: barron
title: Blog
permalink: /blog/
nav: true
nav_order: 3
---

<!-- Blog Section -->
<table class="section-table section-table--spaced">
  <tbody>
    <tr>
      <td class="section-cell">
        <h2>Blog</h2>
        <ul class="list-flush">
          {% for post in site.posts %}
          <li>{{ post.date | date: "[%Y.%m]" }} <a href="{{ post.url | relative_url }}"><b>{{ post.title }}</b></a></li>
          {% endfor %}
        </ul>
      </td>
    </tr>
  </tbody>
</table>
